<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t9bot 🤖 SREXFFX</title>
    <style>
        :root { --neon-red: #ff3333; --accent-glow: rgba(255, 51, 51, 0.4); --glass-bg: rgba(10, 10, 10, 0.85); --user-gradient: linear-gradient(135deg, #ff4d4d 0%, #b30000 100%); --panel-border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #fff; position: relative; }
        .bg-glow { position: fixed; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, #1a0505 0%, #000 100%); z-index: -1; }
        .bg-orb { position: absolute; width: 300px; height: 300px; background: var(--accent-glow); filter: blur(100px); border-radius: 50%; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(-50%, -50%); } to { transform: translate(50%, 50%); } }
        
        /* --- NEW RED SNOW EFFECT CSS --- */
        .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .snowflake { position: absolute; top: -10px; background: var(--neon-red); border-radius: 50%; filter: drop-shadow(0 0 3px var(--neon-red)); opacity: 0.8; animation: fall linear infinite; }
        @keyframes fall {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(80px); opacity: 0; }
        }
        .snowflake:nth-child(1) { left: 10%; width: 4px; height: 4px; animation-duration: 6s; animation-delay: 0s; }
        .snowflake:nth-child(2) { left: 25%; width: 6px; height: 6px; animation-duration: 9s; animation-delay: 1.5s; filter: blur(1px); }
        .snowflake:nth-child(3) { left: 40%; width: 3px; height: 3px; animation-duration: 7s; animation-delay: 3s; }
        .snowflake:nth-child(4) { left: 55%; width: 5px; height: 5px; animation-duration: 11s; animation-delay: 0.5s; }
        .snowflake:nth-child(5) { left: 70%; width: 4px; height: 4px; animation-duration: 8s; animation-delay: 4s; }
        .snowflake:nth-child(6) { left: 85%; width: 7px; height: 7px; animation-duration: 10s; animation-delay: 2s; filter: blur(1px); }
        .snowflake:nth-child(7) { left: 15%; width: 5px; height: 5px; animation-duration: 8s; animation-delay: 5s; }
        .snowflake:nth-child(8) { left: 45%; width: 3px; height: 3px; animation-duration: 12s; animation-delay: 1s; }
        .snowflake:nth-child(9) { left: 65%; width: 6px; height: 6px; animation-duration: 6s; animation-delay: 2.5s; }
        .snowflake:nth-child(10) { left: 95%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 6s; }
        /* ---------------------------------- */

        #sys-info { position: fixed; bottom: 20px; right: 20px; background: var(--glass-bg); border: 1px solid var(--panel-border); padding: 10px 15px; border-radius: 15px; font-family: monospace; font-size: 11px; backdrop-filter: blur(10px); z-index: 100; }
        #sys-info span { color: var(--neon-red); font-weight: bold; }
        #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.8s ease; }
        .loader-bot { font-size: 4rem; animation: float 2s infinite ease-in-out; }
        .loader-text { margin-top: 20px; font-weight: 900; letter-spacing: 8px; color: var(--neon-red); text-transform: uppercase; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        #bot-panel { width: 95%; max-width: 420px; height: 85vh; background: var(--glass-bg); border: 1px solid var(--panel-border); border-radius: 35px; display: none; flex-direction: column; backdrop-filter: blur(25px); position: relative; overflow: hidden; z-index: 10; }
        #panel-header { padding: 20px 25px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
        .lang-selector select { background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 5px 10px; cursor: pointer; }
        #chat-area { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: none; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 88%; animation: msgPop 0.4s ease; }
        .bot-wrapper { align-self: flex-start; }
        .user-wrapper { align-self: flex-end; align-items: flex-end; }
        .rtl-layout { direction: rtl; }
        .label { font-size: 10px; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; }
        .bot-label { color: #666; margin-left: 5px; }
        .user-label { color: #fff; background: var(--neon-red); padding: 2px 8px; border-radius: 6px; }
        .msg { padding: 14px 18px; border-radius: 22px; font-size: 15px; line-height: 1.5; }
        .bot-msg { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); }
        .user-msg { background: var(--user-gradient); }
        .hud-msg { cursor: pointer; border: 1px dashed var(--neon-red); text-align: center; font-weight: bold; background: rgba(255, 51, 51, 0.1) !important; }
        @keyframes msgPop { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .chip-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .chip { background: rgba(255, 51, 51, 0.05); border: 1px solid var(--neon-red); color: #fff; padding: 10px 20px; border-radius: 50px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .sensi-card { background: #000; border: 1px solid var(--neon-red); border-radius: 20px; padding: 20px; margin-top: 15px; position: relative; overflow: hidden; }
        .row { display: flex; justify-content: space-between; margin: 8px 0; font-family: monospace; font-size: 14px; }
        .val { color: var(--neon-red); font-weight: 900; font-size: 16px; }
        #reset-btn { background: transparent; border: 1px solid #333; color: #888; padding: 6px 15px; border-radius: 12px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="bg-orb"></div></div>
    
    <div class="snow-container">
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
    </div>

    <div id="sys-info">OS: <span id="info-brand">DETECTING...</span> | PWR: <span id="info-batt">--%</span></div>
    <div id="loader"><div class="loader-bot">🤖</div><div class="loader-text">t9bot</div></div>
    <div id="bot-panel">
        <div id="panel-header">
            <button id="reset-btn">🔄 RESET</button>
            <div class="lang-selector">
                <select id="lang-pick">
                    <option value="en">🇺🇸 English</option>
                    <option value="br">🇧🇷 Brazilian</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="ar">🇸🇦 العربية</option>
                </select>
            </div>
        </div>
        <div id="chat-area"></div>
    </div>

    <script>
        const chat = document.getElementById('chat-area');
        const panel = document.getElementById('bot-panel');
        const loader = document.getElementById('loader');
        const langPick = document.getElementById('lang-pick');

        window.onload = function() { startSequence(); };

        function startSequence() {
            setTimeout(() => {
                loader.style.transform = 'translateY(-100%)';
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; panel.style.display = 'flex'; startBot(); }, 600);
            }, 1500);
        }

        /* --- UPDATED TRANSLATIONS FOR BOOST FPS & NO RECOIL --- */
        const translations = {
            en: { welcome: "Welcome to t9bot! I'm here to give you the best sensi for every type of phones.", start: "Create my sensi", brand: "What is your phone brand?", speed: "Do you want High or Slow sensitivity?", applying: "Applying settings...", restart: "Start Over", hudCreate: "Create HUD", fingerQuest: "How many fingers do you play with?", copyMsg: "HUD Copied!", fpsTitle: "Boost FPS & No Recoil", fpsQuest: "How many FPS do you want to unlock?", noRecoilTitle: "No Recoil 🎯" },
            br: { welcome: "Bem-vindo ao t9bot! Estou aqui para dar a melhor sensi para todos os tipos de celulares.", start: "Criar minha sensi", brand: "Qual é a marca do seu celular?", speed: "Você quer sensibilidade Alta ou Lenta?", applying: "Aplicando configurações...", restart: "Recomeçar", hudCreate: "Criar HUD", fingerQuest: "Com quantos dedos você joga?", copyMsg: "HUD copiado!", fpsTitle: "Boost FPS e No Recoil", fpsQuest: "Quantos FPS você deseja desbloquear?", noRecoilTitle: "No Recoil 🎯" },
            fr: { welcome: "Bienvenue sur t9bot ! Je suis là pour vous donner la meilleure sensi pour tous types de téléphones.", start: "Créer ma sensi", brand: "Quelle est la marque de votre téléphone ?", speed: "Voulez-vous une sensibilité Élevée ou Lente ?", applying: "Application des paramètres...", restart: "Recommencer", hudCreate: "Créer HUD", fingerQuest: "Avec combien de doigts jouez-vous ?", copyMsg: "HUD Copié !", fpsTitle: "Boost FPS & No Recoil", fpsQuest: "Combien de FPS voulez-vous débloquer?", noRecoilTitle: "No Recoil 🎯" },
            ar: { welcome: "مرحباً بك في t9bot! أنا هنا لأعطيك أفضل حساسية لكل أنواع الهواتف.", start: "إنشاء الحساسية الخاصة بي", brand: "ما هو نوع هاتفك؟", speed: "هل تريد حساسية عالية أم بطيئة؟", applying: "جاري تطبيق الإعدادات...", restart: "البدء من جديد", hudCreate: "إنشاء HUD", fingerQuest: "بكم إصبع تلعب؟", copyMsg: "تم نسخ الـ HUD!", fpsTitle: "تسريع FPS و No Recoil", fpsQuest: "كم عدد الـ FPS الذي تريد إلغاء قفله؟", noRecoilTitle: "No Recoil 🎯" }
        };

        function addBotMsg(text, chips = [], isHudCode = false) {
            const isAr = langPick.value === 'ar';
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper bot-wrapper ${isAr ? 'rtl-layout' : ''}`;
            wrapper.innerHTML = `<div class="label bot-label">🤖 t9bot by @srexffx</div><div class="msg bot-msg ${isHudCode ? 'hud-msg' : ''}">${text}</div>`;
            if (isHudCode) {
                wrapper.querySelector('.hud-msg').onclick = () => {
                    navigator.clipboard.writeText(text).then(() => { alert(translations[langPick.value].copyMsg); });
                };
            }
            chat.appendChild(wrapper);
            if (chips.length > 0) {
                const container = document.createElement('div');
                container.className = `chip-container ${isAr ? 'rtl-layout' : ''}`;
                chips.forEach(chipText => {
                    const btn = document.createElement('button');
                    btn.className = 'chip'; btn.innerText = chipText;
                    btn.onclick = () => { container.remove(); handleAction(chipText); };
                    container.appendChild(btn);
                });
                chat.appendChild(container);
            }
            chat.scrollTop = chat.scrollHeight;
        }

        function addUserMsg(text) {
            const isAr = langPick.value === 'ar';
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper user-wrapper ${isAr ? 'rtl-layout' : ''}`;
            wrapper.innerHTML = `<div class="label user-label">👤 You</div><div class="msg user-msg">${text}</div>`;
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
        }

        function startBot() {
            chat.innerHTML = "";
            const l = translations[langPick.value];
            chat.classList.toggle('rtl-layout', langPick.value === 'ar');
            addBotMsg(l.welcome, [l.start, l.hudCreate, l.fpsTitle]);
        }

        function handleAction(action) {
            addUserMsg(action);
            const l = translations[langPick.value];
            setTimeout(() => {
                if (action === l.restart) { startBot(); }
                else if (action === l.start) { addBotMsg(l.brand, ["iPhone", "Samsung", "Xiaomi", "Oppo", "Vivo", "Redmi"]); }
                else if (action === l.hudCreate) { addBotMsg(l.fingerQuest, ["2F", "3F", "4F"]); }
                else if (action === l.fpsTitle) { addBotMsg(l.fpsQuest, ["90 FPS", "120 FPS", "144 FPS"]); }
                else if (["90 FPS", "120 FPS", "144 FPS"].includes(action)) {
                    addBotMsg(`⚡ ${parseInt(action)} Optimization initialized...`);
                    setTimeout(() => triggerFakeCoding(parseInt(action)), 1000);
                } else if (action === l.noRecoilTitle) {
                    addBotMsg("📡 Initializing anti-recoil data synchronization mechanics...");
                    setTimeout(() => triggerNoRecoilCoding(), 1000);
                } else if (["2F", "3F", "4F"].includes(action)) {
                    const codes = {"2F": "#FFHUDT6O3jhr5qTtPo7eM", "3F": "#FFHUDT6O3jhr5qTtPo7eO", "4F": "#FFHUDT6O3jhr5qTtPo7eN"};
                    addBotMsg(codes[action], [l.restart], true);
                } else if (["iPhone", "Samsung", "Xiaomi", "Oppo", "Vivo", "Redmi"].includes(action)) {
                    window.userBrand = action;
                    const spd = langPick.value === 'en' ? ["High", "Slow"] : (langPick.value === 'br' ? ["Alta", "Lenta"] : (langPick.value === 'fr' ? ["Élevée", "Lente"] : ["عالية", "بطيئة"]));
                    addBotMsg(l.speed, spd);
                } else {
                    addBotMsg(l.applying);
                    setTimeout(() => generateSensi(action), 1200);
                }
            }, 600);
        }

        function triggerFakeCoding(targetFps) {
            const logs = [`> loading srex_booster_core.sh...`, `> bypassing stock system constraints [OK]`, `> clearing background cache data...`, `> stabilizing tracking metrics...`, `> injecting tweaks...`, `> overclocking rendering layers...`];
            let currentLog = 0; const id = 'c-' + Date.now();
            addBotMsg(`<div id="${id}" style="font-family:monospace; font-size:12px; color:#00ff00; line-height:1.6; text-align:left;"></div>`);
            const el = document.getElementById(id);
            const interval = setInterval(() => {
                if (currentLog < logs.length) { el.innerHTML += logs[currentLog++] + "<br/>"; chat.scrollTop = chat.scrollHeight; }
                else { clearInterval(interval); setTimeout(() => animateFpsCounter(targetFps), 800); }
            }, 300);
        }

        function triggerNoRecoilCoding() {
            const logs = [`> fetching axis anchors...`, `> stability check [PASS]`, `> optimizing drag arrays...`, `> locking micro-vectors...`, `> running memory injection...`, `> norecoil it's applied successfully!`];
            let currentLog = 0; const id = 'r-' + Date.now();
            addBotMsg(`<div id="${id}" style="font-family:monospace; font-size:12px; color:#00ffff; line-height:1.6; text-align:left;"></div>`);
            const el = document.getElementById(id);
            const interval = setInterval(() => {
                if (currentLog < logs.length) { el.innerHTML += logs[currentLog++] + "<br/>"; chat.scrollTop = chat.scrollHeight; }
                else { clearInterval(interval); setTimeout(() => addBotMsg(`🎯 norecoil skills Alok,Kelly,D-bee,Laura`, [translations[langPick.value].restart]), 800); }
            }, 300);
        }

        function animateFpsCounter(targetFps) {
            const id = 'f-' + Date.now(); const l = translations[langPick.value];
            addBotMsg(`<div class="sensi-card" style="text-align:center; padding:30px 10px;"><p style="font-size:12px; color:#aaa; letter-spacing:1px; margin-bottom:5px;">CURRENT PERFORMANCE</p><h1 id="${id}" style="font-size:54px; color:var(--neon-red); font-weight:900;">60 FPS</h1><p style="font-size:10px; color:#444; margin-top:10px;">SREX T9 AUTOMATED BOOSTER</p></div>`, [l.noRecoilTitle, l.restart]);
            const el = document.getElementById(id);
            let steps = [77, 89, 98, 107, 114, targetFps].filter(n => n <= targetFps);
            let idx = 0;
            const counterInterval = setInterval(() => { if (idx < steps.length) { el.innerText = `${steps[idx++]} FPS`; } else { clearInterval(counterInterval); } }, 200);
        }

        function generateSensi(speedType) {
            let isHigh = speedType.match(/High|Alta|Élevée|عالية/), b = window.userBrand, g, dpi;
            if (b === "iPhone") { g = isHigh ? 97 : 90; dpi = "NO DPI"; }
            else if (b === "Samsung") { g = isHigh ? 190 : 145; dpi = isHigh ? 800 : 450; }
            else if (b === "Xiaomi" || b === "Redmi") { g = isHigh ? 195 : 160; dpi = isHigh ? 720 : 410; }
            else { g = isHigh ? 175 : 130; dpi = isHigh ? 600 : 400; }
            
            const labels = { en: ["GENERAL", "RED DOT", "2X SCOPE", "4X SCOPE", "SNIPER", "FREE LOOK", "DPI"], br: ["GERAL", "PONTO VERMELHO", "MIRA 2X", "MIRA 4X", "SNIPER", "OLHADINHA", "DPI"], fr: ["GÉNÉRAL", "POINT ROUGE", "LUNETTE 2X", "LUNETTE 4X", "SNIPER", "REGARD LIBRE", "DPI"], ar: ["عام", "نقطة حمراء", "عدسة 2X", "عدسة 4X", "قناص", "نظرة حرة", "DPI"] }[langPick.value];
            
            addBotMsg(`🤖 **${b.toUpperCase()} SETTINGS**<div class="sensi-card">` + 
                `<div class="row"><span>${labels[0]}</span><span class="val">${g}</span></div>` +
                `<div class="row"><span>${labels[1]}</span><span class="val">${g-5}</span></div>` +
                `<div class="row"><span>${labels[2]}</span><span class="val">${g-8}</span></div>` +
                `<div class="row"><span>${labels[3]}</span><span class="val">${g-12}</span></div>` +
                `<div class="row"><span>${labels[4]}</span><span class="val">${isHigh?110:70}</span></div>` +
                `<div class="row"><span>${labels[5]}</span><span class="val">200</span></div>` +
                `<div class="row"><span>${labels[6]}</span><span class="val">${dpi}</span></div>` +
                `</div>`, [translations[langPick.value].hudCreate, translations[langPick.value].restart]);
        }

        document.getElementById('reset-btn').onclick = startBot;
        langPick.onchange = startBot;
        const ua = navigator.userAgent.toLowerCase();
        document.getElementById('info-brand').innerText = ua.includes("android") ? "ANDROID" : (ua.includes("iphone") ? "IOS" : "WEB-SYS");
        if (navigator.getBattery) { navigator.getBattery().then(b => { const up = () => document.getElementById('info-batt').innerText = Math.round(b.level * 100) + "%"; up(); b.onlevelchange = up; }); }
    </script>
</body>
</html>
